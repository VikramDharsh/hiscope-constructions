# Render Blueprint — deploy backend API + frontend static site
# MongoDB Atlas is required (set MONGO_URL manually in the dashboard)

services:
  - type: web
    name: hiscope-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: hiscope
      - key: CORS_ORIGINS
        value: "*"
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_RECIPIENT_EMAIL
        sync: false

  - type: web
    name: hiscope-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: hiscope-api
          envVarKey: RENDER_EXTERNAL_URL
